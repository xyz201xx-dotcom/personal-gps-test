<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1e8" />
    <meta name="description" content="走行中の現在地とGPS推定精度を5秒ごとに表示します。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css" />
    <title>いまここ精度</title>
  </head>
  <body>
    <main class="app">
      <section class="reading" aria-live="polite" aria-atomic="true">
        <p class="eyebrow" id="status">GPS精度を体感する</p>

        <div id="result" class="result" hidden>
          <h1 id="place" class="place">現在地を確認中</h1>
          <p class="accuracy">推定精度 <strong id="accuracy">—</strong></p>
          <p id="coordinates" class="coordinates"></p>
        </div>

        <div id="welcome" class="welcome">
          <h1>現在地と精度を<br />5秒ごとに表示</h1>
          <p>走行前に位置情報の利用を許可してください。</p>
          <button id="start" type="button">計測をはじめる</button>
        </div>
      </section>

      <footer>
        <span id="pulse" class="pulse" aria-hidden="true"></span>
        <span id="updated">停止中</span>
      </footer>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
